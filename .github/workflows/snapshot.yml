name: FPL daily snapshot
on:
  schedule:
    - cron: '0 10 * * *'   # 10:00 UTC = na de 09:00 UK lockdown, ook in de winter
  workflow_dispatch: {}
jobs:
  snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Pull FPL data
        env:
          FPL_TEAM_ID: "6756883"
          FPL_LEAGUE_ID: "348280"
        run: python scripts/fpl_pull.py
      - name: Rebuild deadline calendar
        run: python scripts/make_deadlines.py

      - name: Prune old snapshots
        run: find data/snapshots -name 'fpl_*.json' -mtime +14 -delete || true
      - name: Commit and push
        run: |
          git config user.name "fpl-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data/snapshots data/deadlines.csv strategy/season-calendar.md
          if git diff --cached --quiet; then
            echo "Geen wijzigingen — niets te committen."
            exit 0
          fi
          git commit -m "snapshot: $(date -u +%F)"
          git fetch origin main
          git rebase origin/main || git rebase --abort
          git push origin HEAD:main
