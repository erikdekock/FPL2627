name: FPL league history cache (transfers + picks)
on:
  push:
    paths: ['scripts/fpl_history.py', '.github/workflows/history.yml']
  schedule:
    - cron: '30 10 * * *'
  workflow_dispatch: {}
jobs:
  history:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python scripts/fpl_history.py
      - name: Commit and push
        run: |
          git config user.name "fpl-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data/history
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "history: $(date -u +%F)"
          git fetch origin main
          git rebase origin/main || git rebase --abort
          git push origin HEAD:main
